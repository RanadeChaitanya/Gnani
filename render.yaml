# Render Blueprint: one always-on web service built from the Dockerfile.
# Secrets are marked `sync: false`; Render asks for them when the Blueprint is first applied.
services:
  - type: web
    name: saar
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Gnani Prisma speech-to-text
      - key: GNANI_API_KEY
        sync: false
      # Record writing (DeepSeek, OpenAI-compatible)
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_MODEL
        value: deepseek-chat
      - key: OPENAI_COMPAT_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_COMPAT_API_KEY
        sync: false
      # Spend cap per running instance; the free plan has no disk, so it resets when the service restarts
      - key: LLM_BUDGET_USD
        value: "0.09"
      # Voice call (LiveKit Cloud)
      - key: CALL_AUDIO_PROVIDER
        value: livekit
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
