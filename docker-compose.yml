services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/saar.db
    volumes: [saar-data:/data]

  # Optional fully-local call audio: `docker compose --profile livekit up`
  # then set LIVEKIT_URL=ws://<your-lan-ip>:7880 LIVEKIT_API_KEY=devkey LIVEKIT_API_SECRET=secret
  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

volumes:
  saar-data:
